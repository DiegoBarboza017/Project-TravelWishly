{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center align-items-center main-min-height">
    <div class="col-md-7 col-lg-5">
        <div class="card border-dark border-3 rounded-0 shadow-none hover-lift"
            style="box-shadow: 8px 8px 0 0 #000 !important;">
            <div class="card-header bg-white border-bottom border-dark border-3 pt-4 pb-3 px-4 text-center">
                <i class="bi bi-person-fill-add fs-1 text-dark mb-2"></i>
                <h3 class="fw-bold mb-0 text-uppercase tracking-wider">Crea tu Perfil</h3>
                <p class="text-dark small fw-bold mb-0 mt-2 text-uppercase">Tu información se encripta de forma segura
                </p>
            </div>
            <div class="card-body p-4 p-md-5 bg-white">
                <form action="{{ url_for('registro') }}" method="POST">
                    <div class="mb-4">
                        <label for="username" class="form-label text-dark fw-bold text-uppercase">Nombre de Usuario
                            Público</label>
                        <div class="input-group">
                            <span class="input-group-text bg-white border-dark border-2 border-end-0 rounded-0"><i
                                    class="bi bi-person text-dark"></i></span>
                            <input type="text"
                                class="form-control border-dark border-2 border-start-0 ps-0 text-dark rounded-0 fw-bold"
                                id="username" name="username" placeholder="ej. VIAJERO123" required>
                        </div>
                    </div>
                    <div class="mb-4">
                        <label for="email" class="form-label text-dark fw-bold text-uppercase">Correo Electrónico
                            Válido</label>
                        <div class="input-group">
                            <span class="input-group-text bg-white border-dark border-2 border-end-0 rounded-0"><i
                                    class="bi bi-envelope text-dark"></i></span>
                            <input type="email"
                                class="form-control border-dark border-2 border-start-0 ps-0 text-dark rounded-0 fw-bold"
                                id="email" name="email" placeholder="VIAJERO@EMAIL.COM" required>
                        </div>
                    </div>
                    <div class="mb-5">
                        <label for="password" class="form-label text-dark fw-bold text-uppercase">Contraseña
                            Fuerte</label>
                        <div class="input-group">
                            <span class="input-group-text bg-white border-dark border-2 border-end-0 rounded-0"><i
                                    class="bi bi-lock text-dark"></i></span>
                            <input type="password"
                                class="form-control border-dark border-2 border-start-0 ps-0 text-dark rounded-0 fw-bold"
                                id="password" name="password" placeholder="MíNIMO 8 CARACTERES" required>
                        </div>
                    </div>
                    <button type="submit"
                        class="btn btn-dark w-100 py-3 fw-bold rounded-0 text-uppercase tracking-wider border-2 border-dark">Registrarse
                        Totalmente Gratis</button>

                    <div class="text-center mt-4 fw-bold small text-uppercase">
                        ¿Ya formas parte de TravelWishly? <a href="{{ url_for('login') }}"
                            class="text-dark text-decoration-none fw-bold ms-1 border-bottom border-dark border-2">Inicia
                            Sesión</a>
                    </div>
                </form>

                <hr class="my-4 border-dark border-2 opacity-100" style="border-style: dashed;">
                
                <form action="{{ url_for('magic_login') }}" method="POST">
                    <div class="text-center mb-3">
                        <h6 class="fw-bold text-uppercase text-dark m-0">Registro Automático Seguro</h6>
                        <small class="text-muted fw-bold">Se creará tu usuario de inmediato</small>
                    </div>
                    <div class="input-group mb-3">
                        <span class="input-group-text bg-white border-dark border-2 border-end-0 rounded-0"><i class="bi bi-google text-dark"></i></span>
                        <input type="email" name="google_email" class="form-control border-dark border-2 border-start-0 ps-0 text-dark rounded-0 fw-bold" placeholder="TU CORREO DE GMAIL..." required>
                    </div>
                    <button type="submit" class="btn btn-outline-dark w-100 py-2 fw-bold text-uppercase border-2 border-dark rounded-0 hover-lift d-flex align-items-center justify-content-center" style="transition: all 0.2s; box-shadow: 4px 4px 0 0 #000;"
                    onmouseover="this.style.boxShadow='2px 2px 0 0 #000'; this.style.transform='translateY(2px)';" onmouseout="this.style.boxShadow='4px 4px 0 0 #000'; this.style.transform='translateY(0)';">
                        <i class="bi bi-person-hearts me-2 fs-5"></i> Únete Rápido (Vía Gmail)
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>

<script>
    // Magic Link UX Poller: Observa callado a ver si el usuario ya aprobó la sesión en otra pestaña / celular
    setInterval(() => {
        fetch("{{ url_for('api_check_session') }}")
            .then(res => res.json())
            .then(data => {
                if (data.logged_in) {
                    // Magia! La aprobación pasó vía email en otra ventana. Lo mandamos auto al Inicio.
                    window.location.href = "{{ url_for('index') }}";
                }
            })
            .catch(e => false);
    }, 2000);
</script>

{% endblock %}
