{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center align-items-center main-min-height">
    <div class="col-md-7 col-lg-5">
        <div class="card border-dark border-3 rounded-0 shadow-none hover-lift"
            style="box-shadow: 8px 8px 0 0 #000 !important;">
            <div class="card-header bg-white pt-5 pb-3 px-4 border-bottom border-dark border-3 text-center">
                <i class="bi bi-key-fill fs-1 text-dark mb-2 d-block"></i>
                <h3 class="fw-bold text-dark mt-2 text-uppercase tracking-wider">Recuperar Contraseña</h3>
                <p class="text-dark fw-bold small text-uppercase">Te enviaremos un enlace mágico</p>
            </div>
            <div class="card-body p-4 p-md-5">
                <form action="{{ url_for('reset_password') }}" method="POST">
                    <div class="mb-5">
                        <label for="email" class="form-label text-dark fw-bold text-uppercase">Tu Correo Electrónico</label>
                        <input type="email"
                            class="form-control form-control-lg bg-white border-dark border-2 rounded-0 fw-bold"
                            id="email" name="email" placeholder="viajero@email.com" required>
                    </div>
                    <button type="submit"
                        class="btn btn-dark w-100 py-3 fw-bold rounded-0 text-uppercase tracking-wider hover-lift border-2 border-dark"
                        style="transition: all 0.3s ease; box-shadow: 4px 4px 0 0 #000;"
                        onmouseover="this.style.transform='translateY(-2px)'; this.style.boxShadow='6px 6px 0 0 #000';"
                        onmouseout="this.style.transform='translateY(0)'; this.style.boxShadow='4px 4px 0 0 #000';">
                        Enviar Enlace de Recuperación
                    </button>
                    <div class="text-center mt-4 fw-bold small text-uppercase text-dark">
                        ¿Recordaste tu contraseña? <a href="{{ url_for('login') }}"
                            class="text-dark border-2 border-bottom border-dark text-decoration-none fw-bold ms-1">Volver a Login</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
