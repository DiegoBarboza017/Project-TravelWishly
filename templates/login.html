{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center align-items-center main-min-height">
    <div class="col-md-7 col-lg-5">
        <div class="card border-dark border-3 rounded-0 shadow-none hover-lift"
            style="box-shadow: 8px 8px 0 0 #000 !important;">
            <div class="card-header bg-white pt-5 pb-2 px-4 border-bottom border-dark border-3 text-center">
                <div class="d-inline-flex align-items-center justify-content-center border border-dark border-3 text-dark rounded-0 mb-3"
                    style="width: 80px; height: 80px; box-shadow: 4px 4px 0 0 #000;">
                    <i class="bi bi-airplane-engines fs-1"></i>
                </div>
                <h3 class="fw-bold text-dark mt-2 text-uppercase tracking-wider">Bienvenido de Vuelta</h3>
                <p class="text-dark fw-bold small text-uppercase">Inicia sesión en tu cuenta</p>
            </div>
            <div class="card-body p-4 p-md-5">
                <form action="{{ url_for('login') }}" method="POST">
                    <div class="mb-4">
                        <label for="user_email" class="form-label text-dark fw-bold text-uppercase">Correo o
                            Usuario</label>
                        <input type="text"
                            class="form-control form-control-lg bg-white border-dark border-2 rounded-0 fw-bold"
                            id="user_email" name="user_email" placeholder="TU IDENTIFICADOR..." required>
                    </div>
                    <div class="mb-4">
                        <label for="password"
                            class="form-label d-flex justify-content-between text-dark fw-bold text-uppercase">
                            <span>Contraseña</span>
                            <a href="#"
                                class="text-dark border-bottom border-dark border-2 text-decoration-none small">¿Olvidaste
                                tu contraseña?</a>
                        </label>
                        <input type="password"
                            class="form-control form-control-lg bg-white border-dark border-2 rounded-0 fw-bold"
                            id="password" name="password" placeholder="••••••••" required>
                    </div>
                    <div class="mb-4 form-check">
                        <input type="checkbox" class="form-check-input border-dark bg-white rounded-0" id="rememberMe"
                            style="border-width: 2px;">
                        <label class="form-check-label text-dark fw-bold small text-uppercase" for="rememberMe">Mantener
                            sesión iniciada</label>
                    </div>
                    <button type="submit"
                        class="btn btn-outline-dark w-100 py-3 fw-bold rounded-0 text-uppercase tracking-wider bg-white">Entrar
                        al Tablero</button>
                    <div class="text-center mt-4 fw-bold small text-uppercase text-dark">
                        ¿Nuevo explorador? <a href="{{ url_for('registro') }}"
                            class="text-dark border-2 border-bottom border-dark text-decoration-none fw-bold ms-1">Regístrate
                            ahora</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
