{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center align-items-center main-min-height">
    <div class="col-md-7 col-lg-5">
        <div class="card border-dark border-3 rounded-0 shadow-none hover-lift"
            style="box-shadow: 8px 8px 0 0 #000 !important;">
            <div class="card-header bg-white pt-5 pb-2 px-4 border-bottom border-dark border-3 text-center">
                <div class="d-inline-flex align-items-center justify-content-center border border-dark border-3 text-dark rounded-0 mb-3"
                    style="width: 80px; height: 80px; box-shadow: 4px 4px 0 0 #000;">
                    <i class="bi bi-airplane-engines fs-1"></i>
                </div>
                <h3 class="fw-bold text-dark mt-2 text-uppercase tracking-wider">Bienvenido de Vuelta</h3>
                <p class="text-dark fw-bold small text-uppercase">Inicia sesión en tu cuenta</p>
            </div>
            <div class="card-body p-4 p-md-5">
                <form action="{{ url_for('login') }}" method="POST">
                    <div class="mb-4">
                        <label for="user_email" class="form-label text-dark fw-bold text-uppercase">Correo o
                            Usuario</label>
                        <input type="text"
                            class="form-control form-control-lg bg-white border-dark border-2 rounded-0 fw-bold"
                            id="user_email" name="user_email" placeholder="TU IDENTIFICADOR..." required>
                    </div>
                    <div class="mb-4">
                        <label for="password"
                            class="form-label d-flex justify-content-between text-dark fw-bold text-uppercase">
                            <span>Contraseña</span>
                            <a href="{{ url_for('reset_password') }}"
                                class="text-dark border-bottom border-dark border-2 text-decoration-none small">¿Olvidaste
                                tu contraseña?</a>
                        </label>
                        <input type="password"
                            class="form-control form-control-lg bg-white border-dark border-2 rounded-0 fw-bold"
                            id="password" name="password" placeholder="••••••••" required>
                    </div>
                    <div class="mb-4 form-check">
                        <input type="checkbox" class="form-check-input border-dark rounded-0" id="rememberMe" name="rememberMe"
                            style="border-width: 2px; cursor: pointer;">
                        <label class="form-check-label text-dark fw-bold small text-uppercase" for="rememberMe" style="cursor: pointer;">Mantener
                            sesión iniciada</label>
                    </div>
                    <button type="submit"
                        class="btn btn-dark w-100 py-3 fw-bold rounded-0 text-uppercase tracking-wider hover-lift border-2 border-dark"
                        style="transition: all 0.3s ease; box-shadow: 4px 4px 0 0 #000;"
                        onmouseover="this.style.transform='translateY(-2px)'; this.style.boxShadow='6px 6px 0 0 #000';"
                        onmouseout="this.style.transform='translateY(0)'; this.style.boxShadow='4px 4px 0 0 #000';">Entrar
                        al Tablero</button>
                    <div class="text-center mt-4 fw-bold small text-uppercase text-dark">
                        ¿Nuevo explorador? <a href="{{ url_for('registro') }}"
                            class="text-dark border-2 border-bottom border-dark text-decoration-none fw-bold ms-1">Regístrate
                            ahora</a>
                    </div>
                </form>

                <hr class="my-4 border-dark border-2 opacity-100" style="border-style: dashed;">
                
                <form action="{{ url_for('magic_login') }}" method="POST">
                    <div class="text-center mb-3">
                        <h6 class="fw-bold text-uppercase text-dark m-0">Acceso Rápido sin contraseña</h6>
                        <small class="text-muted fw-bold">Recibe un enlace de 1-click en tu correo</small>
                    </div>
                    <div class="input-group mb-3">
                        <span class="input-group-text bg-white border-dark border-2 border-end-0 rounded-0"><i class="bi bi-google text-dark"></i></span>
                        <input type="email" name="google_email" class="form-control border-dark border-2 border-start-0 ps-0 text-dark rounded-0 fw-bold" placeholder="TU CORREO @GMAIL.COM" required>
                    </div>
                    <button type="submit" class="btn btn-outline-dark w-100 py-2 fw-bold text-uppercase border-2 border-dark rounded-0 hover-lift d-flex align-items-center justify-content-center" style="transition: all 0.2s; box-shadow: 4px 4px 0 0 #000;"
                    onmouseover="this.style.boxShadow='2px 2px 0 0 #000'; this.style.transform='translateY(2px)';" onmouseout="this.style.boxShadow='4px 4px 0 0 #000'; this.style.transform='translateY(0)';">
                        <i class="bi bi-envelope-paper-heart-fill me-2 fs-5"></i> Entrar Rápido (Vía Gmail)
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>

<script>
    // Magic Link UX Poller: Observa callado a ver si el usuario ya aprobó la sesión en otra pestaña / celular
    setInterval(() => {
        fetch("{{ url_for('api_check_session') }}")
            .then(res => res.json())
            .then(data => {
                if (data.logged_in) {
                    // Magia! La aprobación pasó vía email en otra ventana. Lo mandamos auto al next url o inicio.
                    const nextUrl = new URLSearchParams(window.location.search).get('next');
                    window.location.href = nextUrl ? nextUrl : "{{ url_for('index') }}";
                }
            })
            .catch(e => false);
    }, 7000);
</script>

{% endblock %}
